# CircleCI — Wangsap continuous packages + GitHub Releases
#
# Every push (any branch): fast `checks` job — svelte-check, cargo fmt, clippy.
# Pushes to main and v* tags additionally:
#   1. build .deb + .rpm (Ubuntu)
#   2. build Arch .pkg.tar.zst
#   3. publish/update GitHub Release "continuous" (main) or immutable v* release
#
# Versioned releases:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Required env (Project Settings → Environment Variables):
#   GITHUB_TOKEN = classic PAT `repo` OR fine-grained Contents: Read/Write

version: 2.1

executors:
  ubuntu_tauri:
    docker:
      - image: cimg/node:22.14
    resource_class: large
    working_directory: ~/project
    environment:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

  arch_makepkg:
    docker:
      - image: archlinux:base-devel
    resource_class: large
    working_directory: /home/builder/project
    environment:
      CARGO_TERM_COLOR: always

commands:
  install_rust:
    steps:
      - run:
          name: Install Rust (stable)
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            source "$HOME/.cargo/env"
            rustc -V
            cargo -V

  restore_cargo_cache:
    steps:
      - restore_cache:
          keys:
            - cargo-v1-{{ checksum "src-tauri/Cargo.lock" }}-{{ arch }}
            - cargo-v1-{{ checksum "src-tauri/Cargo.lock" }}-
            - cargo-v1-

  save_cargo_cache:
    steps:
      - save_cache:
          key: cargo-v1-{{ checksum "src-tauri/Cargo.lock" }}-{{ arch }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git

jobs:
  checks:
    executor: ubuntu_tauri
    steps:
      - checkout

      - run:
          name: Install system dependencies (WebKitGTK dev stack for clippy)
          command: |
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential \
              curl \
              wget \
              file \
              libxdo-dev \
              libssl-dev \
              libgtk-3-dev \
              libwebkit2gtk-4.1-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev

      - install_rust

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      - run:
          name: npm ci
          command: npm ci

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: svelte-check
          command: npm run check

      - run:
          # tauri::generate_context! embeds ../build, so clippy needs it
          name: Frontend build (needed by generate_context!)
          command: npm run build

      - restore_cargo_cache

      - run:
          name: cargo fmt + clippy
          no_output_timeout: 30m
          command: |
            export PATH="$HOME/.cargo/bin:$PATH"
            cd src-tauri
            cargo fmt --check
            cargo clippy --all-targets --locked -- -D warnings
            cargo test --locked

      - save_cargo_cache

  build-deb-rpm:
    executor: ubuntu_tauri
    steps:
      - checkout

      - run:
          name: Install system dependencies (Tauri / WebKitGTK)
          command: |
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential \
              curl \
              wget \
              file \
              libxdo-dev \
              libssl-dev \
              libgtk-3-dev \
              libwebkit2gtk-4.1-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              patchelf \
              rpm \
              libfuse2

      - install_rust
      - restore_cargo_cache

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      - run:
          name: npm ci
          command: npm ci

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Tauri build (.deb + .rpm)
          no_output_timeout: 45m
          command: |
            export PATH="$HOME/.cargo/bin:$PATH"
            npm run tauri build -- --bundles deb,rpm

      - save_cargo_cache

      - run:
          name: Collect artifacts
          command: |
            mkdir -p /tmp/ws/deb-rpm
            find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' \) -exec cp -v {} /tmp/ws/deb-rpm/ \;
            cp -v src-tauri/target/release/wangsap /tmp/ws/deb-rpm/wangsap-linux-x86_64
            cd /tmp/ws/deb-rpm
            # fail loudly if either bundle is missing
            ls ./*.deb ./*.rpm
            sha256sum ./* > SHA256SUMS-deb-rpm.txt
            ls -lah

      - store_artifacts:
          path: /tmp/ws/deb-rpm
          destination: linux-deb-rpm

      - persist_to_workspace:
          root: /tmp/ws
          paths:
            - deb-rpm

  build-arch:
    executor: arch_makepkg
    steps:
      - run:
          name: Bootstrap Arch image (user + deps)
          command: |
            pacman -Syu --noconfirm
            pacman -S --noconfirm --needed \
              base-devel \
              git \
              sudo \
              curl \
              wget \
              nodejs \
              npm \
              rust \
              pkgconf \
              webkit2gtk-4.1 \
              gtk3 \
              libsoup3 \
              libappindicator \
              openssl \
              cairo \
              gdk-pixbuf2 \
              librsvg \
              hicolor-icon-theme
            useradd -m -G wheel builder
            echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
            chown -R builder:builder /home/builder

      - checkout:
          path: /tmp/wangsap-src

      - run:
          name: Prepare project tree for builder
          command: |
            mkdir -p /home/builder/project
            tar -C /tmp/wangsap-src \
              --exclude=node_modules \
              --exclude=src-tauri/target \
              --exclude=.git \
              -cf - . \
              | tar -C /home/builder/project -xf -
            rustc --version | tee /home/builder/project/rust-version.txt
            chown -R builder:builder /home/builder/project

      - restore_cache:
          keys:
            - arch-cargo-v1-{{ checksum "rust-version.txt" }}-{{ checksum "src-tauri/Cargo.lock" }}
            - arch-cargo-v1-{{ checksum "rust-version.txt" }}-

      - restore_cache:
          keys:
            - arch-npm-v1-{{ checksum "package-lock.json" }}
            - arch-npm-v1-

      - run:
          name: makepkg (Arch package)
          no_output_timeout: 45m
          command: |
            chown -R builder:builder /home/builder
            su - builder -c '
              set -euo pipefail
              export CARGO_HOME=/home/builder/.cargo
              export CARGO_TARGET_DIR=/home/builder/cargo-target
              export npm_config_cache=/home/builder/.npm
              cd /home/builder/project/packaging/arch
              rustc -V || true
              cargo -V || true
              makepkg -f --noconfirm
              ls -lah
            '

      - save_cache:
          key: arch-cargo-v1-{{ checksum "rust-version.txt" }}-{{ checksum "src-tauri/Cargo.lock" }}
          paths:
            - /home/builder/.cargo/registry
            - /home/builder/.cargo/git
            - /home/builder/cargo-target

      - save_cache:
          key: arch-npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - /home/builder/.npm

      - run:
          name: Collect Arch artifacts
          command: |
            mkdir -p /tmp/ws/arch
            cp -v /home/builder/project/packaging/arch/wangsap-*.pkg.tar.zst /tmp/ws/arch/ 2>/dev/null || \
              cp -v /home/builder/project/packaging/arch/wangsap-*.pkg.tar.xz /tmp/ws/arch/ 2>/dev/null || true
            cd /tmp/ws/arch
            sha256sum * > SHA256SUMS-arch.txt || true
            ls -lah

      - store_artifacts:
          path: /tmp/ws/arch
          destination: linux-arch

      - persist_to_workspace:
          root: /tmp/ws
          paths:
            - arch

  publish-github-release:
    docker:
      - image: cimg/base:current
    resource_class: medium
    steps:
      - checkout

      - attach_workspace:
          at: /tmp/ws

      - run:
          name: Install GitHub CLI (pinned tarball — not tied to Ubuntu repos)
          command: |
            GH_VERSION=2.63.2
            curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" | tar xz -C /tmp
            sudo install "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
            gh --version

      - run:
          name: Publish GitHub Release (continuous or version tag)
          command: |
            set -euo pipefail

            if [[ -z "${GITHUB_TOKEN:-}" ]]; then
              echo "ERROR: GITHUB_TOKEN is not set."
              echo "CircleCI → Project Settings → Environment Variables → GITHUB_TOKEN"
              exit 1
            fi
            export GH_TOKEN="$GITHUB_TOKEN"

            # checkout step lands here — keep path before leaving the repo tree
            REPO_ROOT="$(pwd)"
            git -C "$REPO_ROOT" rev-parse --is-inside-work-tree

            REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            SHA="${CIRCLE_SHA1}"
            SHORT="${SHA:0:7}"
            BRANCH="${CIRCLE_BRANCH:-}"
            TAG_NAME="${CIRCLE_TAG:-}"

            mkdir -p /tmp/release
            cp -v /tmp/ws/deb-rpm/* /tmp/release/ 2>/dev/null || true
            cp -v /tmp/ws/arch/* /tmp/release/ 2>/dev/null || true

            # drop per-job checksum fragments; build one combined file
            rm -f /tmp/release/SHA256SUMS-deb-rpm.txt /tmp/release/SHA256SUMS-arch.txt /tmp/release/SHA256SUMS.txt
            (
              cd /tmp/release
              sha256sum * > SHA256SUMS.txt 2>/dev/null || true
              ls -lah
            )

            mapfile -t FILES < <(find /tmp/release -maxdepth 1 -type f | sort)
            if [[ ${#FILES[@]} -eq 0 ]]; then
              echo "ERROR: no release files in workspace"
              exit 1
            fi

            # Changelog: commits since previous continuous release (or last 15)
            # Always use git -C so we never depend on cwd after handling artifacts.
            PREV_SHA=""
            if gh release view continuous --repo "$REPO" >/dev/null 2>&1; then
              PREV_SHA="$(gh release view continuous --repo "$REPO" --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)"
            fi

            # ensure we can resolve SHAs (shallow clones)
            git -C "$REPO_ROOT" fetch --unshallow 2>/dev/null || true
            git -C "$REPO_ROOT" fetch --tags --force 2>/dev/null || true

            if [[ -n "$PREV_SHA" ]] && git -C "$REPO_ROOT" cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
              CHANGELOG="$(git -C "$REPO_ROOT" log --pretty=format:'- %s (%h)' --no-merges "${PREV_SHA}..${SHA}" | head -n 40)"
              RANGE="${PREV_SHA:0:7}…${SHORT}"
            else
              CHANGELOG="$(git -C "$REPO_ROOT" log --pretty=format:'- %s (%h)' --no-merges -n 15)"
              RANGE="recent"
            fi
            if [[ -z "${CHANGELOG// /}" ]]; then
              CHANGELOG="- (no new commits listed)"
            fi

            WHEN="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            # --- Version tag push (immutable release) ---
            if [[ -n "$TAG_NAME" ]]; then
              NOTES="$(cat \<<EOF
            ## Wangsap \`${TAG_NAME}\`

            **Commit:** \`${SHORT}\`  
            **Built:** ${WHEN} UTC

            ### Changelog
            ${CHANGELOG}

            ### Downloads
            | File | Distro |
            |------|--------|
            | \`*.deb\` | Debian / Ubuntu / Mint / Pop |
            | \`*.rpm\` | Fedora / RHEL / openSUSE |
            | \`*.pkg.tar.zst\` | Arch / Manjaro / Endeavour |
            | \`wangsap-linux-x86_64\` | raw binary |

            Not affiliated with Meta. NVIDIA blank WebView: \`WEBKIT_DISABLE_DMABUF_RENDERER=1\`
            EOF
            )"
              if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
                gh release upload "$TAG_NAME" "${FILES[@]}" --repo "$REPO" --clobber
                gh release edit "$TAG_NAME" --repo "$REPO" --notes "$NOTES" || true
              else
                gh release create "$TAG_NAME" "${FILES[@]}" \
                  --repo "$REPO" \
                  --title "Wangsap ${TAG_NAME}" \
                  --target "$SHA" \
                  --notes "$NOTES"
              fi
              echo "Published versioned release: https://github.com/${REPO}/releases/tag/${TAG_NAME}"
              exit 0
            fi

            # --- Continuous release on main (rolling, updated every push) ---
            if [[ "$BRANCH" != "main" && "$BRANCH" != "master" ]]; then
              echo "Branch '${BRANCH}' is not main/master — skip GitHub Release."
              echo "Artifacts remain on the CircleCI job Artifacts tab."
              exit 0
            fi

            NOTES="$(cat \<<EOF
            ## Wangsap continuous build

            Rolling build from **\`${BRANCH}\`** — updated on every push.

            | | |
            |---|---|
            | **Commit** | [\`${SHORT}\`](https://github.com/${REPO}/commit/${SHA}) |
            | **Range** | ${RANGE} |
            | **Built** | ${WHEN} UTC |

            ### Changelog
            ${CHANGELOG}

            ### Downloads
            | File | Distro |
            |------|--------|
            | \`*.deb\` | Debian / Ubuntu / Mint / Pop |
            | \`*.rpm\` | Fedora / RHEL / openSUSE |
            | \`*.pkg.tar.zst\` | Arch / Manjaro / Endeavour |
            | \`wangsap-linux-x86_64\` | raw binary |

            Always install from this release for the latest CI build.  
            Optional immutable versions: push a tag \`v0.1.0\`.

            Not affiliated with Meta. NVIDIA: \`WEBKIT_DISABLE_DMABUF_RENDERER=1\`
            EOF
            )"

            if gh release view continuous --repo "$REPO" >/dev/null 2>&1; then
              echo "Updating rolling release: continuous"
              gh release edit continuous \
                --repo "$REPO" \
                --title "Wangsap continuous (${SHORT})" \
                --notes "$NOTES" \
                --target "$SHA"
              gh release upload continuous "${FILES[@]}" --repo "$REPO" --clobber
            else
              echo "Creating rolling release: continuous"
              # --target creates/moves the tag on GitHub; no local git tag needed
              gh release create continuous "${FILES[@]}" \
                --repo "$REPO" \
                --title "Wangsap continuous (${SHORT})" \
                --target "$SHA" \
                --notes "$NOTES" \
                --prerelease
            fi

            echo "Published: https://github.com/${REPO}/releases/tag/continuous"

workflows:
  build-and-release:
    jobs:
      # Fast quality gate on every branch push and tag
      - checks:
          filters:
            tags:
              only: /.*/
      # Heavy builds + release only on main and v* tags
      - build-deb-rpm:
          requires:
            - checks
          filters:
            branches:
              only:
                - main
                - master
            tags:
              only: /^v.*/
      - build-arch:
          requires:
            - checks
          filters:
            branches:
              only:
                - main
                - master
            tags:
              only: /^v.*/
      - publish-github-release:
          requires:
            - build-deb-rpm
            - build-arch
          filters:
            branches:
              only:
                - main
                - master
            tags:
              only: /^v.*/
