# CircleCI — Wangsap continuous packages + GitHub Releases
#
# Every push to main:
#   1. build .deb + .rpm (Ubuntu)
#   2. build Arch .pkg.tar.zst
#   3. publish/update GitHub Release "continuous" with artifacts + changelog
#
# Optional versioned releases still work on tags v*:
#   git tag v0.1.0 && git push origin v0.1.0
#   → separate immutable GitHub Release for that tag
#
# Required env (Project Settings → Environment Variables):
#   GITHUB_TOKEN = classic PAT `repo` OR fine-grained Contents: Read/Write

version: 2.1

executors:
  ubuntu_tauri:
    docker:
      - image: cimg/node:22.14
    resource_class: large
    working_directory: ~/project
    environment:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

  arch_makepkg:
    docker:
      - image: archlinux:base-devel
    resource_class: large
    working_directory: /home/builder/project
    environment:
      CARGO_TERM_COLOR: always

commands:
  install_rust:
    steps:
      - run:
          name: Install Rust (stable)
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            source "$HOME/.cargo/env"
            rustc -V
            cargo -V

  restore_cargo_cache:
    steps:
      - restore_cache:
          keys:
            - cargo-v1-{{ checksum "src-tauri/Cargo.lock" }}-{{ arch }}
            - cargo-v1-{{ checksum "src-tauri/Cargo.lock" }}-
            - cargo-v1-

  save_cargo_cache:
    steps:
      - save_cache:
          key: cargo-v1-{{ checksum "src-tauri/Cargo.lock" }}-{{ arch }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git

jobs:
  build-deb-rpm:
    executor: ubuntu_tauri
    steps:
      - checkout

      - run:
          name: Install system dependencies (Tauri / WebKitGTK)
          command: |
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential \
              curl \
              wget \
              file \
              libxdo-dev \
              libssl-dev \
              libgtk-3-dev \
              libwebkit2gtk-4.1-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              patchelf \
              rpm \
              libfuse2

      - install_rust
      - restore_cargo_cache

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      - run:
          name: npm ci
          command: |
            npm ci
            npm install-scripts approve esbuild 2>/dev/null || true
            npm rebuild esbuild 2>/dev/null || true

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Tauri build (.deb + .rpm)
          no_output_timeout: 45m
          command: |
            export PATH="$HOME/.cargo/bin:$PATH"
            npm run tauri build -- --bundles deb,rpm

      - save_cargo_cache

      - run:
          name: Collect artifacts
          command: |
            mkdir -p /tmp/ws/deb-rpm
            find src-tauri/target/release/bundle/deb -type f -name '*.deb' -exec cp -v {} /tmp/ws/deb-rpm/ \;
            find src-tauri/target/release/bundle -type f -name '*.rpm' -exec cp -v {} /tmp/ws/deb-rpm/ \; 2>/dev/null || true
            if [[ -f src-tauri/target/release/wangsap ]]; then
              cp -v src-tauri/target/release/wangsap /tmp/ws/deb-rpm/wangsap-linux-x86_64
            fi
            cd /tmp/ws/deb-rpm
            sha256sum * > SHA256SUMS-deb-rpm.txt || true
            ls -lah

      - store_artifacts:
          path: /tmp/ws/deb-rpm
          destination: linux-deb-rpm

      - persist_to_workspace:
          root: /tmp/ws
          paths:
            - deb-rpm

  build-arch:
    executor: arch_makepkg
    steps:
      - run:
          name: Bootstrap Arch image (user + deps)
          command: |
            pacman -Syu --noconfirm
            pacman -S --noconfirm --needed \
              base-devel \
              git \
              sudo \
              curl \
              wget \
              nodejs \
              npm \
              rust \
              pkgconf \
              webkit2gtk-4.1 \
              gtk3 \
              libsoup3 \
              libappindicator \
              openssl \
              cairo \
              gdk-pixbuf2 \
              librsvg \
              hicolor-icon-theme
            useradd -m -G wheel builder
            echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
            chown -R builder:builder /home/builder

      - checkout:
          path: /tmp/wangsap-src

      - run:
          name: Prepare project tree for builder
          command: |
            mkdir -p /home/builder/project
            tar -C /tmp/wangsap-src \
              --exclude=node_modules \
              --exclude=src-tauri/target \
              --exclude=.git \
              -cf - . \
              | tar -C /home/builder/project -xf -
            chown -R builder:builder /home/builder/project

      - run:
          name: makepkg (Arch package)
          no_output_timeout: 45m
          command: |
            su - builder -c '
              set -euo pipefail
              cd /home/builder/project/packaging/arch
              rustc -V || true
              cargo -V || true
              makepkg -f --noconfirm
              ls -lah
            '

      - run:
          name: Collect Arch artifacts
          command: |
            mkdir -p /tmp/ws/arch
            cp -v /home/builder/project/packaging/arch/wangsap-*.pkg.tar.zst /tmp/ws/arch/ 2>/dev/null || \
              cp -v /home/builder/project/packaging/arch/wangsap-*.pkg.tar.xz /tmp/ws/arch/ 2>/dev/null || true
            cd /tmp/ws/arch
            sha256sum * > SHA256SUMS-arch.txt || true
            ls -lah

      - store_artifacts:
          path: /tmp/ws/arch
          destination: linux-arch

      - persist_to_workspace:
          root: /tmp/ws
          paths:
            - arch

  publish-github-release:
    docker:
      - image: cimg/base:current
    resource_class: medium
    steps:
      - checkout

      - attach_workspace:
          at: /tmp/ws

      - run:
          name: Install GitHub CLI
          command: |
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gh

      - run:
          name: Publish GitHub Release (continuous or version tag)
          command: |
            set -euo pipefail

            if [[ -z "${GITHUB_TOKEN:-}" ]]; then
              echo "ERROR: GITHUB_TOKEN is not set."
              echo "CircleCI → Project Settings → Environment Variables → GITHUB_TOKEN"
              exit 1
            fi
            export GH_TOKEN="$GITHUB_TOKEN"

            REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            SHA="${CIRCLE_SHA1}"
            SHORT="${SHA:0:7}"
            BRANCH="${CIRCLE_BRANCH:-}"
            TAG_NAME="${CIRCLE_TAG:-}"

            mkdir -p /tmp/release
            cp -v /tmp/ws/deb-rpm/* /tmp/release/ 2>/dev/null || true
            cp -v /tmp/ws/arch/* /tmp/release/ 2>/dev/null || true
            cd /tmp/release
            rm -f SHA256SUMS.txt SHA256SUMS-deb-rpm.txt SHA256SUMS-arch.txt
            sha256sum * > SHA256SUMS.txt 2>/dev/null || true
            ls -lah

            mapfile -t FILES < <(find /tmp/release -maxdepth 1 -type f | sort)
            if [[ ${#FILES[@]} -eq 0 ]]; then
              echo "ERROR: no release files in workspace"
              exit 1
            fi

            # Changelog: commits since previous continuous release (or last 15)
            PREV_SHA=""
            if gh release view continuous --repo "$REPO" >/dev/null 2>&1; then
              PREV_SHA="$(gh release view continuous --repo "$REPO" --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)"
            fi

            if [[ -n "$PREV_SHA" ]] && git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
              CHANGELOG="$(git log --pretty=format:'- %s (%h)' --no-merges "${PREV_SHA}..${SHA}" | head -n 40)"
              RANGE="${PREV_SHA:0:7}…${SHORT}"
            else
              CHANGELOG="$(git log --pretty=format:'- %s (%h)' --no-merges -n 15)"
              RANGE="recent"
            fi
            if [[ -z "${CHANGELOG// /}" ]]; then
              CHANGELOG="- (no new commits listed)"
            fi

            WHEN="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            # --- Version tag push (immutable release) ---
            if [[ -n "$TAG_NAME" ]]; then
              NOTES="$(cat \<<EOF
            ## Wangsap \`${TAG_NAME}\`

            **Commit:** \`${SHORT}\`  
            **Built:** ${WHEN} UTC

            ### Changelog
            ${CHANGELOG}

            ### Downloads
            | File | Distro |
            |------|--------|
            | \`*.deb\` | Debian / Ubuntu / Mint / Pop |
            | \`*.rpm\` | Fedora / RHEL / openSUSE |
            | \`*.pkg.tar.zst\` | Arch / Manjaro / Endeavour |
            | \`wangsap-linux-x86_64\` | raw binary |

            Not affiliated with Meta. NVIDIA blank WebView: \`WEBKIT_DISABLE_DMABUF_RENDERER=1\`
            EOF
            )"
              if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
                gh release upload "$TAG_NAME" "${FILES[@]}" --repo "$REPO" --clobber
                gh release edit "$TAG_NAME" --repo "$REPO" --notes "$NOTES" || true
              else
                gh release create "$TAG_NAME" "${FILES[@]}" \
                  --repo "$REPO" \
                  --title "Wangsap ${TAG_NAME}" \
                  --target "$SHA" \
                  --notes "$NOTES"
              fi
              echo "Published versioned release: https://github.com/${REPO}/releases/tag/${TAG_NAME}"
              exit 0
            fi

            # --- Continuous release on main (rolling, updated every push) ---
            if [[ "$BRANCH" != "main" && "$BRANCH" != "master" ]]; then
              echo "Branch '${BRANCH}' is not main/master — skip GitHub Release."
              echo "Artifacts remain on the CircleCI job Artifacts tab."
              exit 0
            fi

            NOTES="$(cat \<<EOF
            ## Wangsap continuous build

            Rolling build from **\`${BRANCH}\`** — updated on every push.

            | | |
            |---|---|
            | **Commit** | [\`${SHORT}\`](https://github.com/${REPO}/commit/${SHA}) |
            | **Range** | ${RANGE} |
            | **Built** | ${WHEN} UTC |

            ### Changelog
            ${CHANGELOG}

            ### Downloads
            | File | Distro |
            |------|--------|
            | \`*.deb\` | Debian / Ubuntu / Mint / Pop |
            | \`*.rpm\` | Fedora / RHEL / openSUSE |
            | \`*.pkg.tar.zst\` | Arch / Manjaro / Endeavour |
            | \`wangsap-linux-x86_64\` | raw binary |

            Always install from this release for the latest CI build.  
            Optional immutable versions: push a tag \`v0.1.0\`.

            Not affiliated with Meta. NVIDIA: \`WEBKIT_DISABLE_DMABUF_RENDERER=1\`
            EOF
            )"

            if gh release view continuous --repo "$REPO" >/dev/null 2>&1; then
              echo "Updating rolling release: continuous"
              gh release edit continuous \
                --repo "$REPO" \
                --title "Wangsap continuous (${SHORT})" \
                --notes "$NOTES" \
                --target "$SHA"
              # drop old assets then upload fresh (clobber handles same names)
              gh release upload continuous "${FILES[@]}" --repo "$REPO" --clobber
            else
              echo "Creating rolling release: continuous"
              # lightweight moving tag pointing at this commit
              git tag -f continuous "$SHA" || true
              gh release create continuous "${FILES[@]}" \
                --repo "$REPO" \
                --title "Wangsap continuous (${SHORT})" \
                --target "$SHA" \
                --notes "$NOTES" \
                --prerelease
            fi

            echo "Published: https://github.com/${REPO}/releases/tag/continuous"

workflows:
  build-and-release:
    jobs:
      - build-deb-rpm:
          filters:
            tags:
              only: /.*/
      - build-arch:
          filters:
            tags:
              only: /.*/
      - publish-github-release:
          requires:
            - build-deb-rpm
            - build-arch
          filters:
            # run on all branch pushes + all tags (job itself decides continuous vs v*)
            tags:
              only: /.*/
